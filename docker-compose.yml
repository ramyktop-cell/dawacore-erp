# ==============================================================================
# DawaCore ERP - Production Docker Compose Stack
# Services: PostgreSQL 16 + Redis 7 + NestJS Backend + React/Nginx Frontend + Automated Backup
# ==============================================================================

services:
  # 1. Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: dawacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dawacore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DawaCore_StrongPass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-dawacore_prod}
      TZ: ${TZ:-Africa/Khartoum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dawacore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dawacore} -d ${POSTGRES_DB:-dawacore_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. High-Speed Report & Session Cache (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: dawacore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - dawacore-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. DawaCore NestJS API & Accounting Core
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dawacore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-dawacore}:${POSTGRES_PASSWORD:-DawaCore_StrongPass_2026!}@postgres:5432/${POSTGRES_DB:-dawacore_prod}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-DawaCore_SuperSecret_JWT_Key_ChangeInProd_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      AUTO_SEED: ${AUTO_SEED:-false}
      TZ: ${TZ:-Africa/Khartoum}
    networks:
      - dawacore-net

  # 4. DawaCore Frontend SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dawacore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - dawacore-net

  # 5. Automated Daily Database Backup Daemon
  db-backup:
    image: postgres:16-alpine
    container_name: dawacore-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-dawacore}
      PGPASSWORD: ${POSTGRES_PASSWORD:-DawaCore_StrongPass_2026!}
      PGDATABASE: ${POSTGRES_DB:-dawacore_prod}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      TZ: ${TZ:-Africa/Khartoum}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-db.sh", "--daemon"]
    networks:
      - dawacore-net

networks:
  dawacore-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
