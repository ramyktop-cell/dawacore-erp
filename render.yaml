# ==============================================================================
# Render.com Blueprint (Infrastructure as Code) for DawaCore ERP
# Deploy with Free Web Service on Render + Free Permanent PostgreSQL on Neon.tech
# ==============================================================================
services:
  - type: web
    name: dawacore-erp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: node scripts/render-build.cjs
    startCommand: node scripts/render-start.cjs
    healthCheckPath: /api/licensing/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1d
      - key: AUTO_BOOTSTRAP
        value: "true"
      - key: AUTO_ACTIVATE_CLOUD_LICENSE
        value: "true"
      - key: BOOTSTRAP_COMPANY_NAME
        value: صيدلية دواء كور
      - key: BOOTSTRAP_BRANCH_NAME
        value: الفرع الرئيسي
      - key: BOOTSTRAP_USERNAME
        value: admin
      - key: BOOTSTRAP_PASSWORD
        value: "123456"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
