# ==============================================================================
# Render.com Blueprint (Infrastructure as Code) for MadarCore ERP Preview
# Deploy with Web Service on Render + Managed PostgreSQL
# ==============================================================================
services:
  - type: web
    name: dawacore-erp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: node scripts/render-build.cjs
    startCommand: node scripts/render-start.cjs
    healthCheckPath: /api/licensing/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_MODE
        value: CLOUD
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 1d
      - key: AUTO_SYNC_SCHEMA
        value: "false"
      - key: AUTO_BOOTSTRAP
        value: "false"
      - key: AUTO_ACTIVATE_CLOUD_LICENSE
        value: "true"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
